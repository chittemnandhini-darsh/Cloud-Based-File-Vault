<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cloud File Vault</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- Header -->

    <header>

        <h1>☁ Cloud File Vault</h1>

        <p>
            Securely store and manage your files
        </p>

    </header>


    <!-- Upload Section -->

    <section class="upload-section">

        <h2>Upload File</h2>

        <form id="uploadForm">

            <input
                type="file"
                id="fileInput"
                required
            >

            <button type="submit">
                Upload File
            </button>

        </form>

        <p id="message"></p>

    </section>


    <!-- Files Section -->

    <section class="files-section">

        <h2>My Files</h2>

        <div id="fileList">

            <p>Loading files...</p>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 Cloud File Vault
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
